# v1 config: VGCF + SAJO + URDF placeholder pipeline
# Stages implemented: B (VGCF) + C (SAJO) + F (URDF assembly)
# Stages deferred: A (Wan2.2 video), D (dual Stage-2), E (ACTF fusion)
#
# Stage D is replaced by a single standard TRELLIS Stage-2 call on O_0.
# Stage E is replaced by a vertex-level split using SAJO masks.

io:
  K: 6                              # number of articulation states
  seed: 0
  image_pattern: "rendering_joint_00_state_{i:02d}.png"  # resolved against --input_dir

stage_b:
  remove_disk: true                 # strip grounding disk/carpet from the post-VGCF occupancy
                                    # (FreeArt3D convention; cheap no-op if inputs have no disk)
  sampler: scar                     # "scar" (recommended), "bcac", or "vgcf" (legacy)

bcac:
  # Block selection (of 12 total in TRELLIS Stage-1 DiT)
  block_start: 4                    # first block to patch (inclusive)
  block_end: 9                      # last block to patch (exclusive) → blocks 4,5,6,7,8
  # Three-phase time schedule
  t_full: 0.7                       # above this t: α=1, M=1 (full consensus, safe for move)
  t_release: 0.3                    # below this t: α=0 (free evolution for move differentiation)
  alpha_max: 1.0                    # peak blending strength
  # Mask (reuses P0's log-space percentile approach)
  tau_percentile: 0.65
  active_fraction: 0.8
  eps_log: 1.0e-6
  eta: 0.5                          # sigmoid temperature in log-sigma2 space

scar:
  # Stage B v3 (2026-04-18): symmetric mix only, push disabled.
  # Pass 1 (this SCAR sampler): symmetric mix for K=6 rough alignment.
  # Pass 2 (SDEdit block below): augmented-intersection guide + state 0 refinement.
  # See record/2026-04-18-stageb-v3-sdedit-design.md for the full design.
  #
  # Mix (latent blending): active in steps 0..mix_steps-1.
  # Push DISABLED (alpha_peak=0); historic push branches are inert.
  #
  # steps: not set here -> inherits TRELLIS-image-large default of 25
  # (matches FreeArt3D baseline).
  mix_steps: 8                            # number of early steps to mix (0 disables)
  mix_weights: [0.3, 0.4, 0.3]            # (w_first, w_self, w_last)
  extreme_mix_mode: symmetric             # "symmetric" (per-state formula: mixed^k =
                                          # 0.3*s0 + 0.4*s_k + 0.3*s5) | "mean_of_middles"
  # ★ v3.3.3 (2026-05-23 post-empirical-test): default reverted to z_t.
  # Empirical finding: x_0 mix lacks model self-correction. z_t mix lets
  # the model's conditional denoising (cross-attn to per-state c_k)
  # naturally pull the mixed trajectory back to each state's correct
  # clean signal — model is self-correcting in z_t space, self-reinforcing
  # in x_0 space. v4.3 4/4 success was on z_t mix.
  # 'z_t' (default): mix noisy latent BEFORE model forward.
  # 'x_0' (ablation): mix clean signal estimate AFTER model forward,
  #     rebuild z_{t_next} from mixed x_0 + original eps. Mathematically
  #     equivalent mean alignment, but no in-trajectory self-correction.
  mix_space: z_t
  # Push schedule is generated as alpha(s) = alpha_peak * f(s/(total_steps-1)),
  # with f defined by alpha_decay. If alpha_schedule is also set (list of
  # numbers), it overrides alpha_peak + alpha_decay.
  alpha_peak: 0.0                         # PUSH DISABLED in v3 (set to 0.0). Historic
                                          # 0.5 kept as comment for reference. Any value
                                          # > 0 re-enables the legacy Tweedie push.
  alpha_decay: quadratic                  # linear | quadratic | cosine
                                          # NOTE (2026-04-18): push now uses α·t (σ_t normalized)
                                          # instead of α/t. Effective push shapes:
                                          #   linear   : α·t = peak·(1-s/(N-1))       → linear decay
                                          #   quadratic: α·t = peak·(1-s/(N-1))^3     → cubic decay
                                          #   cosine   : α·t smooth tapers at both ends
  w_floor: 0.2                            # soft-mask floor: at move voxels (M=0) the push
                                          # is still applied at w_floor^2 = 4% strength
                                          # instead of 0. Rescues base-interior-noise and
                                          # state-0 drift voxels that the hard mask wrongly
                                          # classifies as move. Contamination on true-move
                                          # voxels is bounded by w_floor^2 * alpha.
  active_fraction: 0.1                    # keep top-10% latent voxels by energy as "object"
                                          # (16^3 = 4096 voxels, typical object occupies
                                          # 5-15% of latent volume). Old 0.8 was wrong --
                                          # it kept mostly air voxels and drowned the
                                          # base/move variance signal.
  tau_percentile: 0.65                    # log-variance percentile threshold
  eps_log: 1.0e-6                         # numerical stability in log
  eta: 0.5                                # sigmoid sharpness in log-variance
  # Post-hoc ICP is DISABLED (removed from Stage B main path).
  # Rationale:
  #   (1) Rigid translation on binary 64^3 voxel grid via trilinear resample
  #       introduces artifacts that can be worse than the sub-voxel drift
  #       it tries to correct.
  #   (2) ICP target (state 0) may itself be the outlier (weaker image
  #       constraint in closed state) -- aligning 1..K-1 to state 0 pulls
  #       them toward the outlier.
  #   (3) With `mean_of_middles` mix wiping out latent-init bias, residual
  #       rigid drift after SCAR should already be minimal; if any remains,
  #       Stage C's canonical aggregation handles it in the EM.
  icp_enabled: false
  icp_max_translation: 1.5                # kept for legacy ablation (icp_enabled=true)
  icp_vote_threshold: 0.83                # kept for legacy ablation
  remove_disk: true

  # v8 (2026-04-24): capture SS-DiT 1024-dim hidden states at mid-late blocks ×
  # mid-flow timestep for downstream Stage C articulated-part discrimination.
  # Saved as ``dit_hidden.pt`` = {"hidden_states": {idx: Tensor(K, L=4096, C=1024)},
  # "meta": {...}} in fp16. Disabled by default to preserve legacy run shape;
  # set to true when preparing data for Stage C v8+ experiments.
  capture_dit_hidden: true
  dit_hook_blocks: [14, 16, 18]           # DIFT-analogous semantic mid-late blocks
  dit_hook_t_star: 0.3                    # flow-time sweet spot (0=clean, 1=noise)

stage_b_sdedit:
  # Pass 2 refinement. Activates after Pass 1 (the `scar` block above) completes.
  # Two modes:
  #   - bmcsa (v4, default, 2026-04-18): Pass 2 is K=6 SDEdit from per-state guide
  #     + BMCSA (Base-Masked Cross-State Attention) inside DiT at every self-attn
  #     layer. All K states are refined and replaced. See spec v4.
  #   - v3 (legacy): Pass 2 is K=6 SDEdit without BMCSA; only states in
  #     refine_states are replaced (middles kept from Pass 1). Kept as ablation.
  enabled: true                           # false -> Pass 2 skipped, Stage B = Pass 1 only
  mode: bmcsa                             # bmcsa | v3

  # ---- SDEdit starting point (both modes) ----
  t_star: 0.5                             # noise level at Pass 2 start;
                                          # x_{t*} = (1-t*)*z_guide + sigma_{t*}*eps_shared
  guide_mode: augmented_intersection      # "augmented_intersection" or "pure_intersection"

  # ---- BMCSA (v4 only; ignored when mode=v3) ----
  pass2_steps: 12                         # fixed Euler step count for Pass 2;
                                          # independent of t_star. v3 uses
                                          # ceil(total_steps * t_star) instead.
  tau_M: 0.05                             # sigmoid sharpness for M_base(P_base_shared)
  token_resolution: 16                    # DiT token res/axis. TRELLIS-image-large has
                                          # resolution=16, patch_size=1, so tokens = 16^3
                                          # = 4096. Must match flow_model.resolution /
                                          # flow_model.patch_size. Pool kernel = 64 / this.
  exclude_state_0: false                  # v4.1 canonical: P_base_shared = mean over ALL K states
                                          # (incl. state 0). At K=6, state 0's closed-state shrink
                                          # bias is diluted to 1/6 of the mean, which keeps cabinet
                                          # outer-shell voxels above the 0.5 threshold. Set true to
                                          # revert to mean over s1-5 only (ablation).
  bmcsa_blocks: all                       # "all" or list of block indices (e.g. [4,5,6,7,8]);
                                          # which DiT self-attn layers get BMCSA
  bmcsa_strength: 1.0                     # effective M_blend = clamp(strength*M_base, 0, 1)

  # ---- v4.2 Plan 3: attention-driven M_attn (optional) ----
  # When enabled, BMCSA blend uses M_effective = M_base × M_attn (element-wise).
  # M_attn is built from cross-state cosine similarity of z_final's per-token
  # features: high similarity → cabinet-like → M_attn high; low similarity →
  # move-like → M_attn low. Rejects "drawer trajectory middle" voxels that
  # have high geometric consensus but divergent semantic features.
  attn_m_enabled: true                    # false: legacy v4.1 (M_base only). true: v4.2/v4.3.
  # v4.3 (2026-04-18): where to apply the M_attn semantic filter:
  #   "guide" (default) : upsample M_attn to 64^3 via trilinear interp, filter
  #                       P_base_shared_64 BEFORE guide construction. Single
  #                       source of truth; fixes "guide over-large base"
  #                       problem observed on sample 26525 (Problem 13 in
  #                       record/stageb_detail.md).
  #   "bmcsa"           : legacy v4.2 behaviour: M_attn applied at BMCSA blend
  #                       time only (M_effective = M_base × M_attn inside each
  #                       DiT self-attn layer). Leaves guide unfiltered; known
  #                       to collapse under long-drawer prismatic joints.
  #   "both"            : apply at BOTH guide and BMCSA (defensive; usually
  #                       equivalent to "guide" since M_attn is idempotent).
  # ★ v3.3.3 reverted to 'guide' only. Applying M_attn at BMCSA blend
  # (multi-gate mode) was a multiplicative attenuator on base voxels —
  # any K-state semantic ambiguity at edges multiplied M_eff down,
  # hurting base extraction. 'guide'-only keeps M_attn as a Pass-2
  # starting-point filter (where it works as intended) without
  # interfering with the K-state averaging in BMCSA blend.
  attn_m_apply_at: guide
  # Synthetic-test sweep (separation Δ=shell-drawer):
  #   thresh=0.5, tau=0.10 → Δ=0.24  (too loose, drawer M_attn=0.75)
  #   thresh=0.7, tau=0.05 → Δ=0.86  (recommended default)
  #   thresh=0.8, tau=0.05 → Δ=0.96  (aggressive; may filter too much)
  attn_m_threshold: 0.7                   # sigmoid center for agreement → M_attn
  attn_m_tau: 0.05                        # sigmoid sharpness; smaller = sharper transition

  # ---- v3.3.2 Multi-gate BMCSA (method.md section 5.2 + GPT review) ----
  # The BMCSA per-token gate M_eff is a PRODUCT of independent signals:
  #   M_eff = M_base_geom        # static, Pass-1 P_base_shared (v4.3 proven)
  #         * M_attn             # static, 8-channel z_final agreement (v4.3 proven)
  #         * (1 - M_motion)     # static, swept-volume reversal (v3.3.2 NEW)
  #         * M_dynamic          # optional step-adaptive attenuator
  # Critical design: dynamic-M is an ATTENUATOR (can only reduce sharing,
  # never single-handedly classify a voxel as base). Empirical v3.3 failure
  # mode (M ≈ 1 saturated, move smeared by K-state averaging) is prevented
  # by the multi-gate product: even if M_dynamic saturates, M_motion -> 0
  # on move voxels and the product kills sharing there.
  M_compute_mode: dynamic                 # 'dynamic' (default) | 'static' (ablation)
  # ★ v3.3.4 (2026-05-23 post-critical-thinking pass): dynamic-M signal source.
  # Old default ('cosine' on L2-normalised 8-ch prev_x_0_pred) saturated to
  # ~0.998 universally (stageB.md Problem 2). Root cause: L2-normalize per-
  # token discards the latent MAGNITUDE which is the strongest base/move
  # discriminator (occupied voxels have much larger SS-latent norm than
  # empty voxels). At intermediate Pass-2 t in (0, 0.5], K-state Tweedie
  # estimates under shared noise are also direction-near-collinear, so the
  # remaining cosine signal is wiped out.
  #
  # 'variance' (new default): un-normalised cross-state log-variance + in-
  # batch quantile sigmoid. Identical math to SCAR.compute_tweedie_variance_mask
  # which is already empirically validated as a Pass-1 mask. Preserves
  # magnitude, auto-adapts per sample (no global magic threshold).
  # 'cosine' kept as ablation.
  M_dynamic_signal: variance              # 'variance' (default, v3.3.4) | 'cosine' (legacy)
  # variance-path knobs (effective when M_dynamic_signal=variance)
  var_percentile: 0.65                    # log-variance quantile for sigmoid center
  var_eta: 0.5                            # sigmoid sharpness in log-variance space
  # cosine-path knobs (effective when M_dynamic_signal=cosine, legacy)
  tau_M_dynamic: 0.7                      # sigmoid center for 8-channel x_0_pred cosine
  kappa_M_dynamic: 0.05                   # sigmoid sharpness
  capture_dynamic_M: true                 # log per-step per-block M_eff for diagnostics
  # ★ v3.3.4 re-enabled: motion corridor is now the DECISIVE gate selecting
  # between K/V-averaged y_shared and per-state y_self. The v3.3.2 base-
  # attenuation bug came from MULTIPLICATIVE composition M_eff = M_base ×
  # M_attn × (1-M_motion) × M_dyn (any low gate cascaded the others down at
  # edges). v3.3.4 redesigns the composition to use M_base as a SAFETY
  # FLOOR (capping M_move down where base is confident) instead of as a
  # multiplicative term, plus a kv_floor K-redundancy floor (next block).
  # Re-enabling motion corridor is what restores the "drawer above floor"
  # physical realism observed in v3.3.2 s2/s4 but lost in v3.3.3.
  use_motion_corridor: true               # ★ v3.3.4 ON (was false in v3.3.3, true in v3.3.2)

  # ★ v3.3.4 Plan C+ (2026-05-24): motion corridor SOURCE.
  # 'enhanced': OR-compose 3 cross-state signals:
  #   A) occupancy footprint*(1-shared)  (from soft_p1; weakened by SCAR)
  #   B) z_final 8-d cross-state variance (16^3 -> 64^3 trilinear)
  #   C) dit_hidden 1024-d cross-state variance at block 14/16/18
  #      avg (16^3 -> 64^3); requires scar.capture_dit_hidden=true
  # 'occupancy_only' (legacy v3.3.4 v1): source A only.
  #
  # ★ v3.3.4 v2 reverted to 'occupancy_only' (2026-05-24, post Plan C+ test):
  # Plan C+ multi-source OR-composition was empirically REJECTED — sources
  # B and C over-saturated to ~1 at 99% of object voxels (1024-d hidden
  # variance is structurally large everywhere), making M_motion_enhanced
  # essentially uniform. Combined with v3.3.4's M_base safety floor
  # (M_move *= (1 - M_base)), this KILLED the per-state signal at the
  # very base-motion boundary where physical detail would show, because
  # cabinet floor voxels have HIGH M_base AND HIGH M_motion -> M_move = 0 ->
  # full K-averaging -> drawer stuck to cabinet floor (the TRELLIS prior).
  # Plan C+ direction was wrong: stronger motion alone cannot override
  # v3.3.4 base safety floor at the base-motion BOUNDARY where physical
  # realism manifests. See diagnostic comparison v1 vs v2 in critical-
  # thinking session 2026-05-24. Plan C+ code retained as ablation
  # ('enhanced' switch) for AAAI ablation table.
  motion_corridor_source: occupancy_only  # ★ v3.3.4 v2 reverted from 'enhanced'
  motion_zfinal_percentile: 0.55          # source B sigmoid center quantile (when enhanced)
  motion_zfinal_eta: 0.5                  # source B sigmoid sharpness
  motion_hidden_percentile: 0.55          # source C sigmoid center quantile
  motion_hidden_eta: 0.5                  # source C sigmoid sharpness

  # ★ v3.3.4 K-redundancy floor (s3-loss mitigation).
  # v3.3.2 had per-state branches in corridor with ~100% y_self -> single-
  # state TRELLIS instability (e.g. s3 corruption) had no K backup. kv_floor
  # forces M_move <= 1 - kv_floor at every voxel, so K/V averaging always
  # contributes at least kv_floor fraction. Trades a small amount of
  # physical-realism preservation for cross-state robustness against
  # single-state failures.
  kv_floor: 0.2                           # ★ v3.3.4 NEW (default: 20% K-redundancy)

  # ★ v3.3.5 (2026-05-24): default-per-state K-share composition.
  # Reverse-engineered from v3.3.2 outputs/30857/stageb_3.3.2 BMCSA gate
  # analysis. v3.3.2 dynamic-M was saturated to 1 (the cosine bug we identified)
  # which made M_eff = M_base * M_attn * (1-M_motion) * 1 ~= 0 at 99% voxels
  # because M_base mean was 0.012. The accidental "M_eff ~= 0 everywhere"
  # gave per-state attention to 99% of tokens, preserving per-state c_k
  # driven geometry (drawer z=37 above cabinet z=36, the user-observed
  # physical effect).
  #
  # v3.3.4 v1/v2 inverted this default: M_move = motion * (1 - M_base)
  # forced M_move=0 at cabinet floor (where M_base*M_motion both high) ->
  # K-share dominant at the very location where physical detail emerges
  # -> drawer fused to cabinet floor.
  #
  # v3.3.5 restores v3.3.2's default-per-state behaviour WITHOUT the cosine
  # saturation bug:
  #   P_definite_base = M_base * (1 - M_motion_combined)
  #   M_move = 1 - alpha * P_definite_base
  # At true base far from motion (M_base=1, motion=0): M_move=0.1 -> 90% K-share
  # At cabinet floor with motion (M_base=1, motion=0.9): M_move=0.91 -> ~per-state
  # At motion corridor far from base: M_move=1 -> per-state
  # alpha=0.9 matches v3.3.2's effective K-share strength at confident base.
  base_kshare_alpha: 0.9                  # ★ v3.3.5 NEW (0=ignore M_base, 1=hard K-share at base)
                                          # Only effective when bmcsa_composition=v335.

  # ★★★ v3.3.6 FINAL (2026-05-24): Stage B locked design.
  # After 4 iterations (v3.3.2 / v3.3.3 / v3.3.4 / v3.3.5), the empirically
  # validated final composition is v3.3.4 motion-aware safety floor:
  #
  #   M_motion_combined = max(M_motion_static, M_motion_dynamic)
  #   M_move = M_motion_combined * (1 - M_base_geom)
  #   M_move = clamp(M_move, 0, 1 - kv_floor)
  #
  # PRODUCTION DEFAULT = 'v334'. Reasoning:
  #   - Base completeness: STRONG (M_move=0 at confident base -> full K-share)
  #   - Base/move separation: CLEAR (Plan C+ verified 943x signal strength
  #     but no visible benefit; v3.3.5 default-per-state likewise no benefit)
  #   - Physical drawer-above-cabinet effect: NOT achievable at BMCSA level
  #     in this framework (gave up after v3.3.5; left as future work for
  #     Stage C/D mesh post-process)
  #
  # ABLATIONS (for AAAI paper Table):
  #   'v335': default-per-state composition (reverse-engineered from
  #           v3.3.2 dynamic-M cosine saturation accident). Same empirical
  #           output as v334 on 30857 but different theoretical framing.
  #
  # CONFIGURATION COMPATIBILITY (FINAL, all flags below are AT FINAL VALUES):
  #   scar.mix_space: z_t           (v4.3-validated)
  #   M_compute_mode: dynamic       (use dynamic-M)
  #   M_dynamic_signal: variance    (F1, fixed cosine saturation)
  #   var_percentile: 0.65, var_eta: 0.5  (F1 sigmoid params)
  #   use_motion_corridor: true     (motion gate active)
  #   motion_corridor_source: occupancy_only  (Plan C+ off; enhanced as ablation)
  #   attn_m_apply_at: guide        (M_attn at guide only, not BMCSA)
  #   kv_floor: 0.2                 (s3-loss safety)
  #   bmcsa_composition: v334       (THIS DEFAULT)
  bmcsa_composition: v334                 # ★★★ v3.3.6 FINAL ('v334' | 'v335' ablation)

  # ---- v3 legacy (ignored when mode=bmcsa) ----
  # Which states v3 replaces with Pass 2 output (middles kept from Pass 1).
  # Negative indices are normalised (-1 -> K-1). bmcsa mode always replaces all K.
  refine_states: [0]
  guide_eta: 1.0e-4                       # logit clip for pre-encode binarise (legacy)

vgcf:
  enabled: true                     # set false to get plain TRELLIS Stage-1 behavior
  steps: 12                         # Stage-1 Euler integration steps
  cfg_strength: 7.5                 # classifier-free guidance weight
  cfg_interval: [0.0, 1.0]          # apply CFG across the full trajectory
  rescale_t: 1.0                    # flow schedule rescale (TRELLIS default)
  lambda_max: 1.0                   # max consensus-guidance strength
  t_stop: 0.2                       # below this t, guidance is disabled (noise -> data direction)
  eta: 0.5                          # sigmoid temperature in log-sigma2 space (P0 fix)
  seed: 0                           # shared-noise seed for cross-state coupling

  # --- P0 mask-quality fixes (diagnostic upgrade) ---
  # Raw sigma2 is 5+ orders of magnitude long-tail; median threshold +
  # fixed 1e-8 active filter leaves M_mean ~= 0.4 which is too low for
  # doors/cabinets. The three knobs below should lift M_mean to ~0.65.
  active_fraction: 0.8              # keep top fraction of voxels by ||x0_bar||^2 energy
  tau_percentile: 0.65              # 65th percentile of log-sigma2 as base threshold
  eps_log: 1.0e-6                   # log(sigma2 + eps_log) numerical stability
  lambda_schedule: warmup           # "warmup" (sin-peaked at middle) or "cosine" (legacy)

sajo:
  split:                            # joint-free soft base/move split (C1)
    sigma_b: 0.25
    sigma_m: 0.15
    tau_b: 0.05
    tau_m: 0.05
  anchors:                          # 26-connectivity contact anchor extraction (C2)
    min_component_size: 8
    max_components: 2
    binarize_threshold: 0.5
  em:                               # EM optimization (C4)
    n_outer: 20
    n_inner: 10
    lr_S: 1.0e-2
    lr_phi: 5.0e-3
    alpha: 0.1                      # anchor-term weight
    beta: 1.0e-4                    # prior (Tikhonov) weight on phi_k
    eta_r: 0.05                     # sigmoid temperature for M_move E-step
    tol: 1.0e-4                     # relative convergence on L_reg
    active_voxel_thresh: 0.1        # threshold for "active move voxel" count
  bic:                              # dual-model BIC selection (C5)
    k_rev: 4                        # revolute constant complexity (+ K added in code)
    k_pris: 2                       # prismatic constant complexity (+ K added in code)
    min_N: 50                       # if N < min_N, suppress confidence reporting

stage_d:
  use_vgcf_O_0: true                # if false, re-run Stage-1 without VGCF for the Stage-2 input
  simplify: 0.95
  texture_size: 1024
  baking_mode: fast

pybullet:
  n_samples: 20
  epsilon: 1.0e-3                   # penetration depth tolerance (meters in URDF scale)

trellis:
  stage2_sampler_params:            # reused for the placeholder single Stage-2 call
    steps: 25
    cfg_strength: 10
    cfg_interval: [0.5, 1.0]
